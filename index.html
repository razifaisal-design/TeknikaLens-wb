<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeknikaLens Web</title>
<style>
  :root { --tombol: #1a73e8; --latar: #f1f3f4; --kartu: #ffffff; --teks: #202124; --redup: #5f6368; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--latar); color: var(--teks); }
  header { background: var(--kartu); padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #dadce0; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header .akun { font-size: 13px; color: var(--redup); }
  button { cursor: pointer; }
  .btn { background: var(--tombol); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: bold; }
  .btn:disabled { opacity: .5; }
  .btn-ghost { background: var(--kartu); color: var(--tombol); border: 1px solid var(--tombol); border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  #layar-masuk { max-width: 380px; margin: 8vh auto; background: var(--kartu); border-radius: 16px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #layar-masuk h2 { margin: 0 0 4px; }
  #layar-masuk p { color: var(--redup); font-size: 13px; margin: 0 0 18px; }
  #layar-masuk input { width: 100%; padding: 12px 14px; margin-bottom: 12px; font-size: 16px; border: 1px solid #dadce0; border-radius: 10px; }
  #galat { color: #c5221f; font-size: 13px; min-height: 20px; margin: 4px 0 8px; }
  #aplikasi { display: none; max-width: 1100px; margin: 0 auto; padding: 16px 20px 40px; }
  #daftar-kategori { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .folder { background: var(--kartu); border-radius: 12px; padding: 16px; border: 1px solid #dadce0; text-align: left; font-size: 15px; }
  .folder.aktif { border: 2px solid var(--tombol); }
  .folder b { display: block; font-size: 16px; }
  .folder span { color: var(--redup); font-size: 13px; }
  #baris-judul { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
  #baris-judul h2 { margin: 0; flex: 1; font-size: 18px; }
  #daftar-lokasi { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  #daftar-lokasi:empty { display: none; }
  #kisi:empty { display: none; }
  #kisi { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .foto { background: var(--kartu); border-radius: 10px; overflow: hidden; border: 1px solid #dadce0; padding: 0; text-align: left; }
  .foto img { width: 100%; height: 130px; object-fit: cover; display: block; background: #20242b; }
  .foto div { padding: 6px 8px 8px; font-size: 12px; }
  .foto div b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foto div span { color: var(--redup); }
  #bungkus-lainnya { text-align: center; margin: 18px 0; }
  #ringan { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 10; flex-direction: column; }
  #ringan img { max-width: 100%; max-height: 72vh; object-fit: contain; margin: auto; }
  #ringan .info { color: #eee; padding: 10px 18px; font-size: 13px; max-height: 16vh; overflow: auto; }
  #ringan .baris { padding: 0 18px 18px; display: flex; gap: 10px; }
  #ringan .baris button { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>TeknikaLens</h1>
  <span class="akun" id="teks-akun"></span>
  <button class="btn-ghost" id="btn-keluar" style="display:none">Keluar</button>
</header>

<div id="layar-masuk">
  <h2>Masuk</h2>
  <p>Pakai username dan password yang sama dengan aplikasi HP.</p>
  <input id="in-user" placeholder="username" autocomplete="username">
  <input id="in-pass" type="password" placeholder="password" autocomplete="current-password">
  <div id="galat"></div>
  <button class="btn" id="btn-masuk" style="width:100%">Masuk</button>
</div>

<div id="aplikasi">
  <div id="daftar-kategori"></div>
  <div id="baris-judul" style="display:none">
    <button class="btn-ghost" id="btn-kembali">‹ Kembali</button>
    <h2 id="judul-kategori"></h2>
    <button class="btn-ghost" id="btn-segarkan">Muat ulang</button>
  </div>
  <div id="daftar-lokasi"></div>
  <div id="kisi"></div>
  <div id="bungkus-lainnya"><button class="btn-ghost" id="btn-lainnya" style="display:none">Muat 100 berikutnya</button></div>
</div>

<div id="ringan">
  <img id="ringan-img" alt="foto">
  <div class="info" id="ringan-info"></div>
  <div class="baris">
    <button class="btn" id="ringan-unduh">Unduh</button>
    <button class="btn-ghost" id="ringan-tutup" style="color:#fff;border-color:#fff">Tutup</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ---- isi dua ini bila berbeda dengan aplikasi HP ----
const SUPABASE_URL = "https://bjdrlkfgrcqkfqptqtwt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__AMuMW6s5Cq2RAw2-R3KIQ_PqOCnDMW";
const DOMAIN_EMAIL = "teknikalens.app";
const PER_HALAMAN = 100;

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const layarMasuk = $("layar-masuk"), aplikasi = $("aplikasi"), galat = $("galat");
let kategoriAktif = null;   // {id, nama}
let lokasiAktif = null;     // {id, nama}
let dariBaris = 0;
let fotoAktif = null;

const thumb = (url) => url.replace("/upload/", "/upload/w_500,c_limit,q_auto/");
const penuh = (url) => url.replace("/upload/", "/upload/w_1600,c_limit,q_auto/");

// ---------------------------------------------------------------- masuk / keluar

async function masuk() {
  galat.textContent = "";
  const user = $("in-user").value.trim().toLowerCase();
  const pass = $("in-pass").value;
  if (!user || !pass) { galat.textContent = "Isi username dan password."; return; }
  $("btn-masuk").disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: user + "@" + DOMAIN_EMAIL, password: pass });
  $("btn-masuk").disabled = false;
  if (error) { galat.textContent = terjemah(error.message); return; }
  await sesudahMasuk();
}

function terjemah(pesan) {
  const m = (pesan || "").toLowerCase();
  if (m.includes("invalid login credentials")) return "Username atau password salah.";
  if (m.includes("email not confirmed")) return "Akun belum dikonfirmasi. Hubungi admin.";
  return pesan || "Gagal masuk.";
}

async function sesudahMasuk() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;
  layarMasuk.style.display = "none";
  aplikasi.style.display = "block";
  $("btn-keluar").style.display = "";
  const { data: profil } = await db.from("profiles").select("username,nama,role").eq("id", session.user.id).maybeSingle();
  $("teks-akun").textContent = profil ? `@${profil.username} · ${profil.role}` : "";
  await muatKategori();
}

async function keluar() {
  await db.auth.signOut();
  location.reload();
}

$("btn-masuk").onclick = masuk;
$("in-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") masuk(); });
$("btn-keluar").onclick = keluar;

// ---------------------------------------------------------------- folder kategori

async function muatKategori() {
  const wadah = $("daftar-kategori");
  wadah.innerHTML = "<p style='color:var(--redup)'>Memuat kategori ...</p>";
  const { data, error } = await db.from("kategori").select("id,nama").order("nama");
  if (error) { wadah.innerHTML = "<p>Gagal memuat: " + escapeHtml(error.message) + "</p>"; return; }
  wadah.innerHTML = "";
  for (const k of data || []) {
    const b = document.createElement("button");
    b.className = "folder";
    b.innerHTML = "<b></b><span>memuat ...</span>";
    b.querySelector("b").textContent = k.nama;
    b.onclick = () => pilihKategori(k, b);
    wadah.appendChild(b);
    hitungFoto(k.id).then((n) => {
      b.querySelector("span").textContent = n < 0 ? "" : n + " foto";
    });
  }
}

async function hitungFoto(kategoriId) {
  const { count, error } = await db.from("photos")
    .select("id", { count: "exact", head: true })
    .eq("kategori_id", kategoriId).not("cloudinary_url", "is", null);
  return error ? -1 : (count ?? -1);
}

function pilihKategori(k, tombol) {
  document.querySelectorAll(".folder").forEach((e) => e.classList.remove("aktif"));
  tombol.classList.add("aktif");
  kategoriAktif = k;
  lokasiAktif = null;
  $("daftar-lokasi").innerHTML = "";
  $("kisi").innerHTML = "";
  $("baris-judul").style.display = "flex";
  $("judul-kategori").textContent = k.nama;
  muatLokasi();
}

$("btn-kembali").onclick = () => {
  if (lokasiAktif) {
    // dari foto -> kembali ke daftar lokasi
    lokasiAktif = null;
    $("kisi").innerHTML = "";
    $("judul-kategori").textContent = kategoriAktif.nama;
    muatLokasi();
  } else {
    // dari lokasi -> kembali ke folder kategori
    kategoriAktif = null;
    $("daftar-lokasi").innerHTML = "";
    $("baris-judul").style.display = "none";
    document.querySelectorAll(".folder").forEach((e) => e.classList.remove("aktif"));
  }
};

$("btn-segarkan").onclick = () => {
  if (lokasiAktif) { dariBaris = 0; $("kisi").innerHTML = ""; muatFoto(); }
  else if (kategoriAktif) { muatLokasi(); }
};

// ---------------------------------------------------------------- folder lokasi

async function muatLokasi() {
  if (!kategoriAktif) return;
  const wadah = $("daftar-lokasi");
  wadah.innerHTML = "<p style='color:var(--redup)'>Memuat lokasi ...</p>";
  const { data: lok, error } = await db.from("locations")
    .select("id,jalan,gang").eq("kategori_id", kategoriAktif.id).order("jalan").limit(1000);
  if (error) { wadah.innerHTML = "<p>Gagal memuat lokasi.</p>"; return; }
  if (!lok || !lok.length) { wadah.innerHTML = "<p style='color:var(--redup)'>Belum ada lokasi pada kategori ini.</p>"; return; }
  // hitung foto per lokasi dalam satu kueri ringan
  let cacah = {};
  const { data: c } = await db.from("photos")
    .select("location_id").eq("kategori_id", kategoriAktif.id).not("cloudinary_url", "is", null).limit(5000);
  for (const r of c || []) cacah[r.location_id] = (cacah[r.location_id] || 0) + 1;
  wadah.innerHTML = "";
  for (const l of lok) {
    const nama = (l.jalan + (l.gang ? " " + l.gang : "")).trim();
    const b = document.createElement("button");
    b.className = "folder";
    b.innerHTML = "<b></b><span></span>";
    b.querySelector("b").textContent = nama;
    b.querySelector("span").textContent = (cacah[l.id] || 0) + " foto";
    b.onclick = () => pilihLokasi(l, nama);
    wadah.appendChild(b);
  }
}

function pilihLokasi(l, nama) {
  lokasiAktif = { id: l.id, nama };
  dariBaris = 0;
  $("kisi").innerHTML = "";
  $("judul-kategori").textContent = kategoriAktif.nama + " › " + nama;
  muatFoto();
}

// ---------------------------------------------------------------- kisi foto

async function muatFoto() {
  if (!lokasiAktif) return;
  $("btn-lainnya").style.display = "none";
  const sampai = dariBaris + PER_HALAMAN - 1;
  const { data, error } = await db.from("photos")
    .select("id,nama_file,cloudinary_url,diambil_pada,sta,progress,keterangan,location_id,user_id")
    .eq("location_id", lokasiAktif.id).not("cloudinary_url", "is", null)
    .order("diambil_pada", { ascending: false }).range(dariBaris, sampai);
  if (error) {
    $("kisi").innerHTML += "<p>Gagal memuat foto.</p>";
    return;
  }
  if (!data || !data.length) {
    if (!dariBaris) $("kisi").innerHTML = "<p style='color:var(--redup)'>Belum ada foto terunggah pada lokasi ini.</p>";
    return;
  }
  // nama pengunggah (satu kueri batch)
  const userIds = [...new Set(data.map((f) => f.user_id).filter(Boolean))].slice(0, 100);
  let petaUser = {};
  if (userIds.length) {
    const { data: usr } = await db.from("profiles").select("id,nama").in("id", userIds);
    for (const u of usr || []) petaUser[u.id] = u.nama;
  }
  const kisi = $("kisi");
  for (const f of data) {
    const jalan = lokasiAktif.nama;
    const b = document.createElement("button");
    b.className = "foto";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = thumb(f.cloudinary_url);
    img.alt = f.nama_file || "foto";
    const cap = document.createElement("div");
    const jb = document.createElement("b");
    jb.textContent = jalan || f.nama_file || "";
    const sp = document.createElement("span");
    sp.textContent = (petaUser[f.user_id] ? petaUser[f.user_id] + " · " : "") + (f.diambil_pada || "").slice(0, 10);
    cap.appendChild(jb); cap.appendChild(sp);
    b.appendChild(img); b.appendChild(cap);
    b.onclick = () => bukaFoto(f, jalan, petaUser[f.user_id] || "");
    kisi.appendChild(b);
  }
  dariBaris += data.length;
  if (data.length === PER_HALAMAN) $("btn-lainnya").style.display = "";
}

$("btn-lainnya").onclick = muatFoto;

// ---------------------------------------------------------------- ringan (lihat + unduh)

function bukaFoto(f, jalan, pengunggah) {
  fotoAktif = f;
  $("ringan-img").src = penuh(f.cloudinary_url);
  let info = (f.nama_file || "") + "\n" + jalan;
  if (pengunggah) info += "\nOleh " + pengunggah;
  info += "\n" + (f.diambil_pada || "").slice(0, 16).replace("T", " ");
  if (f.sta) info += "   STA " + f.sta;
  if (f.progress != null) info += "   " + f.progress + "%";
  if (f.keterangan) info += "\n" + f.keterangan;
  $("ringan-info").innerText = info;
  $("ringan").style.display = "flex";
}

$("ringan-tutup").onclick = () => { $("ringan").style.display = "none"; };
$("ringan").addEventListener("click", (e) => { if (e.target.id === "ringan") $("ringan").style.display = "none"; });
$("ringan-unduh").onclick = async () => {
  if (!fotoAktif) return;
  const a = document.createElement("a");
  a.href = fotoAktif.cloudinary_url;
  a.download = fotoAktif.nama_file || "foto.jpg";
  a.target = "_blank";
  a.click();
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// sesi tersimpan? langsung masuk
db.auth.getSession().then(({ data: { session } }) => { if (session) sesudahMasuk(); });
</script>
</body>
</html>
